services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - edge
      - app-bridge

  web:
    ports: []
    networks:
      - app-bridge

  grafana:
    ports:
      - "3000:3000"
    networks:
      - app-bridge

  prometheus:
    ports: []
    networks:
      - app-bridge

  cadvisor:
    ports: []
    networks:
      - app-bridge

  db:
    ports: []
    networks:
      - app-bridge

  redis:
    ports: []
    networks:
      - app-bridge

networks:
  edge:
    driver: bridge
  app-bridge:
    driver: bridge
    internal: true
