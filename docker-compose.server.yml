services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - grafana
    restart: unless-stopped
    networks:
      - edge
      - app-bridge

  web:
    ports: []
    networks:
      - app-bridge

  grafana:
    ports: []
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - app-bridge

  prometheus:
    ports: []
    networks:
      - app-bridge

  cadvisor:
    ports: []
    networks:
      - app-bridge

  db:
    ports: []
    networks:
      - app-bridge

  redis:
    ports: []
    networks:
      - app-bridge

networks:
  edge:
    driver: bridge
  app-bridge:
    driver: bridge
    internal: true
