services:
  nginx:
      image: nginx:alpine
      container_name: nginx_proxy
      ports:
        - "80:80"
      volumes:
        - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - ./deploy/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      restart: unless-stopped
      networks:
        - app_network

  db:
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_DB=hackathon_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    ports:
      - "127.0.0.1:5432:5432" # Safe local exposure

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app_network

  web:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - METRICS_ENABLED=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network
    deploy:
      replicas: 2
      restart_policy:
        condition: unless-stopped

  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
      - prometheus_data:/prometheus
    secrets:
      - grafana_cloud_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=5d"
    restart: unless-stopped
    networks:
      - app_network

